syntax = "proto3";

package urlcutter;

import "google/protobuf/empty.proto";

option go_package = ".;";

message GetRequest{
  string short_url = 1;
}
message GetResponse{
  string original_url = 1;
}

message ShortenURLs{
  string short_url = 1;
  string original_url = 2;
}
message GetUserURLSRequest{
  int64 user_id = 1;
}
message GetUserURLSResponse{
  repeated ShortenURLs original_urls = 1;
}

message GetStatsResponse{
  int64 total_users = 1;
  int64 total_urls = 2;
}

message PostRequest{
  int64 user_id = 1;
  string original_url = 2;
}
message PostResponse{
  string short_url = 1;
}

message BatchRequestItem{
  int64 correlation_id = 1;
  string original_url = 2;
}
message BatchResponseItem{
  int64 correlation_id = 1;
  string short_url = 2;
}

message PostBatchRequest{
  int64 userID = 1; 
  repeated BatchRequestItem items = 2;
}
message PostBatchResponse{
  repeated BatchResponseItem items = 1;
}

message DeleteUserURLsRequest{
  repeated string original_urls = 1;
}
message DeleteUserURLsResponse{}

message CheckConnecToDBResponse{}

service URLCutter{
  rpc GetHandler(GetRequest) returns (GetResponse);
  rpc GetUserURLs(GetUserURLSRequest) returns (GetUserURLSResponse);
  rpc GetStatsHandler(google.protobuf.Empty) returns (GetStatsResponse);
	rpc PostHandler(PostRequest) returns (PostResponse);
	rpc PostBatchHandler(PostBatchRequest) returns (PostBatchResponse);
	rpc DeleteUserURLs(DeleteUserURLsRequest) returns (DeleteUserURLsResponse);
  rpc CheckConnecToDB(google.protobuf.Empty) returns (CheckConnecToDBResponse);
}